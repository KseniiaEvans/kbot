<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: white; stroke: #333; stroke-width: 2; rx: 8; }
      .github { fill: #24292e; }
      .actions { fill: #2088FF; }
      .docker { fill: #2496ED; }
      .argocd { fill: #EF7B4D; }
      .k8s { fill: #326CE5; }
      .telegram { fill: #0088cc; }
      .text { fill: white; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-dark { fill: #333; }
      .small-text { font-size: 11px; font-weight: normal; }
      .tiny-text { font-size: 9px; font-weight: normal; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-success { stroke: #28a745; stroke-width: 3; }
      .arrow-process { stroke: #ffc107; stroke-width: 2; stroke-dasharray: 5,5; }
      .step-num { fill: #fff; font-size: 16px; font-weight: bold; }
      .badge { fill: #28a745; }
      .badge-text { fill: white; font-size: 10px; font-weight: bold; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" style="font-size: 24px; font-weight: bold; text-anchor: middle; fill: #333;">
    🤖 KBot CI/CD Pipeline Architecture
  </text>
  
  <!-- Subtitle -->
  <text x="700" y="55" style="font-size: 13px; text-anchor: middle; fill: #666;">
    Automated Build, Test, Deploy with GitHub Actions, Docker, Helm &amp; ArgoCD
  </text>

  <!-- Step 1: Developer Push -->
  <g id="step1">
    <circle cx="100" cy="120" r="30" class="github"/>
    <text x="100" y="125" class="text">👨‍💻</text>
    <text x="100" y="165" class="text-dark small-text">Developer</text>
    <text x="100" y="180" class="text-dark small-text">git push</text>
    
    <circle cx="85" cy="105" r="12" class="badge"/>
    <text x="85" y="110" class="step-num">1</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 130 120 L 230 120" class="arrow arrow-success"/>
  <text x="180" y="110" class="text-dark small-text">push to</text>
  <text x="180" y="122" class="text-dark small-text">develop</text>

  <!-- Step 2: GitHub Repository -->
  <g id="step2">
    <rect x="230" y="90" width="140" height="60" class="box github"/>
    <text x="300" y="113" class="text small-text">📦 GitHub</text>
    <text x="300" y="128" class="text small-text">Repository</text>
    <text x="300" y="143" class="text tiny-text">kseniiaevans/</text>
    <text x="300" y="153" class="text tiny-text">kbot</text>
    
    <circle cx="355" cy="95" r="12" class="badge"/>
    <text x="355" y="100" class="step-num">2</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 300 150 L 300 200" class="arrow arrow-success"/>
  <text x="320" y="180" class="text-dark small-text">trigger</text>

  <!-- Step 3: GitHub Actions CI -->
  <g id="step3">
    <rect x="200" y="200" width="200" height="140" class="box actions"/>
    <text x="300" y="220" class="text small-text">⚙️ GitHub</text>
    <text x="300" y="233" class="text small-text">Actions CI</text>
    
    <rect x="210" y="245" width="180" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="300" y="261" class="text small-text">🧪 Run Tests</text>
    
    <rect x="210" y="273" width="180" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="300" y="289" class="text small-text">🔨 Build Image</text>
    
    <rect x="210" y="301" width="180" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="300" y="317" class="text small-text">🏷️ Tag: v0.1.0-</text>
    <text x="300" y="328" class="text tiny-text">hash</text>
    
    <circle cx="385" cy="205" r="12" class="badge"/>
    <text x="385" y="210" class="step-num">3</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 400 270 L 490 270" class="arrow arrow-success"/>
  <text x="445" y="260" class="text-dark small-text">docker</text>
  <text x="445" y="272" class="text-dark small-text">push</text>

  <!-- Step 4: GHCR -->
  <g id="step4">
    <rect x="490" y="230" width="190" height="80" class="box docker"/>
    <text x="585" y="253" class="text small-text">🐳 ghcr.io</text>
    <text x="585" y="268" class="text tiny-text">Container</text>
    <text x="585" y="280" class="text tiny-text">Registry</text>
    <text x="585" y="295" class="text tiny-text">
      kbot:v0.1.0-
    </text>
    <text x="585" y="305" class="text tiny-text">
      99090bc-linux-amd64
    </text>
    
    <circle cx="665" cy="235" r="12" class="badge"/>
    <text x="665" y="240" class="step-num">4</text>
  </g>

  <!-- Arrow back to Actions CD -->
  <path d="M 585 310 L 585 410 L 300 410" class="arrow arrow-process"/>
  <text x="443" y="400" class="text-dark small-text">trigger CD</text>

  <!-- Step 5: GitHub Actions CD -->
  <g id="step5">
    <rect x="200" y="420" width="200" height="100" class="box actions"/>
    <text x="300" y="440" class="text small-text">📝 GitHub</text>
    <text x="300" y="453" class="text small-text">Actions CD</text>
    
    <rect x="210" y="465" width="180" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="300" y="481" class="text small-text">Update values</text>
    
    <rect x="210" y="493" width="180" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="300" y="509" class="text small-text">Commit &amp; Push</text>
    
    <circle cx="385" cy="425" r="12" class="badge"/>
    <text x="385" y="430" class="step-num">5</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M 300 520 L 300 580" class="arrow arrow-success"/>
  <text x="325" y="555" class="text-dark small-text">commit</text>

  <!-- Step 6: Helm Chart -->
  <g id="step6">
    <rect x="210" y="580" width="180" height="80" class="box" style="fill: #0f1689;"/>
    <text x="300" y="603" class="text small-text">⎈ Helm Chart</text>
    <text x="300" y="618" class="text tiny-text">helm/values.yaml</text>
    <text x="300" y="633" class="text tiny-text">
      tag: v0.1.0-
    </text>
    <text x="300" y="645" class="text tiny-text">
      99090bc
    </text>
    
    <circle cx="375" cy="585" r="12" class="badge"/>
    <text x="375" y="590" class="step-num">6</text>
  </g>

  <!-- Arrow 6 -->
  <path d="M 390 620 L 740 620 L 740 270" class="arrow arrow-process"/>
  <text x="565" y="605" class="text-dark tiny-text">ArgoCD polling</text>
  <text x="565" y="615" class="text-dark tiny-text">(every 3min)</text>

  <!-- Step 7: ArgoCD -->
  <g id="step7">
    <rect x="740" y="200" width="210" height="140" class="box argocd"/>
    <text x="845" y="223" class="text small-text">🔄 ArgoCD</text>
    
    <rect x="750" y="235" width="190" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="845" y="251" class="text small-text">🔍 Detect</text>
    <text x="845" y="261" class="text tiny-text">Changes</text>
    
    <rect x="750" y="263" width="190" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="845" y="279" class="text small-text">📊 Compare</text>
    <text x="845" y="289" class="text tiny-text">State</text>
    
    <rect x="750" y="291" width="190" height="23" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="845" y="307" class="text small-text">✅ Auto Sync</text>
    
    <circle cx="935" cy="205" r="12" class="badge"/>
    <text x="935" y="210" class="step-num">7</text>
  </g>

  <!-- Arrow 7 -->
  <path d="M 950 270 L 1040 270" class="arrow arrow-success"/>
  <text x="995" y="260" class="text-dark small-text">kubectl</text>
  <text x="995" y="272" class="text-dark small-text">apply</text>

  <!-- Step 8: Kubernetes -->
  <g id="step8">
    <rect x="1040" y="180" width="230" height="180" class="box k8s"/>
    <text x="1155" y="203" class="text small-text">☸️ Kubernetes</text>
    <text x="1155" y="216" class="text tiny-text">Cluster</text>
    
    <rect x="1050" y="230" width="210" height="28" rx="5" style="fill: rgba(255,255,255,0.2);"/>
    <text x="1155" y="249" class="text small-text">📦 Deployment</text>
    
    <rect x="1055" y="265" width="200" height="23" rx="5" style="fill: rgba(255,255,255,0.3);"/>
    <text x="1155" y="281" class="text small-text">Pod: kbot-xyz</text>
    
    <rect x="1055" y="293" width="200" height="23" rx="5" style="fill: rgba(255,255,255,0.3);"/>
    <text x="1155" y="309" class="text small-text">🔐 Secret:</text>
    <text x="1155" y="319" class="text tiny-text">token</text>
    
    <rect x="1055" y="321" width="200" height="23" rx="5" style="fill: rgba(255,255,255,0.3);"/>
    <text x="1155" y="337" class="text small-text">📋 Service</text>
    
    <circle cx="1255" cy="185" r="12" class="badge"/>
    <text x="1255" y="190" class="step-num">8</text>
  </g>

  <!-- Arrow 8 -->
  <path d="M 1155 360 L 1155 440" class="arrow arrow-success"/>
  <text x="1185" y="395" class="text-dark small-text">container</text>
  <text x="1185" y="407" class="text-dark small-text">runs</text>

  <!-- Step 9: Telegram Bot -->
  <g id="step9">
    <rect x="1055" y="440" width="200" height="100" class="box telegram"/>
    <text x="1155" y="468" class="text">🤖 Telegram</text>
    <text x="1155" y="483" class="text tiny-text">Bot</text>
    <text x="1155" y="503" class="text">ACTIVE</text>
    <text x="1155" y="524" class="text small-text">Responding</text>
    <text x="1155" y="536" class="text tiny-text">to users</text>
    
    <circle cx="1240" cy="445" r="12" class="badge"/>
    <text x="1240" y="450" class="step-num">9</text>
  </g>

  <!-- Feedback Loop -->
  <path d="M 1155 540 L 1155 620 L 950 620 L 950 340" class="arrow" style="stroke: #dc3545; stroke-dasharray: 3,3;"/>
  <text x="1053" y="605" style="fill: #dc3545; font-size: 11px; text-anchor: middle;">
    Monitoring &amp;
  </text>
  <text x="1053" y="617" style="fill: #dc3545; font-size: 11px; text-anchor: middle;">
    Health Checks
  </text>

  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="700" width="1300" height="280" rx="10" style="fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2;"/>
    <text x="700" y="730" style="font-size: 18px; font-weight: bold; text-anchor: middle; fill: #333;">
      📊 CI/CD Pipeline Details
    </text>
    
    <!-- Column 1 -->
    <text x="70" y="760" class="text-dark" style="font-weight: bold; text-anchor: start; font-size: 13px;">Automation Flow:</text>
    <text x="70" y="780" class="text-dark" style="text-anchor: start; font-size: 10px;">
      1️⃣ Developer pushes code to 'develop' branch
    </text>
    <text x="70" y="795" class="text-dark" style="text-anchor: start; font-size: 10px;">
      2️⃣ GitHub Actions triggers CI workflow
    </text>
    <text x="70" y="810" class="text-dark" style="text-anchor: start; font-size: 10px;">
      3️⃣ Tests run, Docker image builds
    </text>
    <text x="70" y="825" class="text-dark" style="text-anchor: start; font-size: 10px;">
      4️⃣ Image pushed to ghcr.io registry
    </text>
    <text x="70" y="840" class="text-dark" style="text-anchor: start; font-size: 10px;">
      5️⃣ CD job updates Helm chart values
    </text>
    
    <!-- Column 2 -->
    <text x="480" y="760" class="text-dark" style="font-weight: bold; text-anchor: start; font-size: 13px;">GitOps Deployment:</text>
    <text x="480" y="780" class="text-dark" style="text-anchor: start; font-size: 10px;">
      6️⃣ New tag committed to Git repository
    </text>
    <text x="480" y="795" class="text-dark" style="text-anchor: start; font-size: 10px;">
      7️⃣ ArgoCD detects changes (polling 3min)
    </text>
    <text x="480" y="810" class="text-dark" style="text-anchor: start; font-size: 10px;">
      8️⃣ ArgoCD syncs Helm chart to K8s
    </text>
    <text x="480" y="825" class="text-dark" style="text-anchor: start; font-size: 10px;">
      9️⃣ New pod deployed with updated image
    </text>
    <text x="480" y="840" class="text-dark" style="text-anchor: start; font-size: 10px;">
      🎉 Telegram bot starts responding
    </text>
    
    <!-- Column 3 - Technologies -->
    <text x="920" y="760" class="text-dark" style="font-weight: bold; text-anchor: start; font-size: 13px;">Technologies:</text>
    <text x="920" y="780" class="text-dark" style="text-anchor: start; font-size: 10px;">
      🐙 GitHub Actions - CI/CD automation
    </text>
    <text x="920" y="795" class="text-dark" style="text-anchor: start; font-size: 10px;">
      🐳 Docker - Containerization
    </text>
    <text x="920" y="810" class="text-dark" style="text-anchor: start; font-size: 10px;">
      ⎈ Helm - Package management
    </text>
    <text x="920" y="825" class="text-dark" style="text-anchor: start; font-size: 10px;">
      🔄 ArgoCD - GitOps deployment
    </text>
    <text x="920" y="840" class="text-dark" style="text-anchor: start; font-size: 10px;">
      ☸️ Kubernetes - Orchestration
    </text>
    
    <!-- Key Features -->
    <rect x="70" y="865" width="380" height="95" rx="5" style="fill: #d4edda; stroke: #c3e6cb; stroke-width: 1;"/>
    <text x="260" y="890" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #155724;">
      ✨ Key Features
    </text>
    <text x="80" y="908" style="font-size: 10px; text-anchor: start; fill: #155724;">
      • Fully automated deployment
    </text>
    <text x="80" y="923" style="font-size: 10px; text-anchor: start; fill: #155724;">
      • Zero-downtime updates
    </text>
    <text x="80" y="938" style="font-size: 10px; text-anchor: start; fill: #155724;">
      • GitOps workflow
    </text>
    <text x="80" y="953" style="font-size: 10px; text-anchor: start; fill: #155724;">
      • Self-healing infrastructure
    </text>
    
    <!-- Image Details -->
    <rect x="470" y="865" width="430" height="95" rx="5" style="fill: #cce5ff; stroke: #b8daff; stroke-width: 1;"/>
    <text x="685" y="890" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #004085;">
      📦 Image Format
    </text>
    <text x="480" y="910" style="font-size: 10px; text-anchor: start; fill: #004085; font-family: monospace;">
      ghcr.io/kseniiaevans/kbot:
    </text>
    <text x="480" y="925" style="font-size: 10px; text-anchor: start; fill: #004085; font-family: monospace;">
      v0.1.0-99090bc-linux-amd64
    </text>
    <text x="480" y="945" style="font-size: 9px; text-anchor: start; fill: #004085;">
      └─ registry/owner/repo:
    </text>
    <text x="480" y="957" style="font-size: 9px; text-anchor: start; fill: #004085;">
      version-commit-os-arch
    </text>
    
    <!-- Deployment Time -->
    <rect x="920" y="865" width="410" height="95" rx="5" style="fill: #fff3cd; stroke: #ffeaa7; stroke-width: 1;"/>
    <text x="1125" y="890" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #856404;">
      ⚡ Deployment Time
    </text>
    <text x="930" y="910" style="font-size: 10px; text-anchor: start; fill: #856404;">
      • CI Build: ~2-3 minutes
    </text>
    <text x="930" y="925" style="font-size: 10px; text-anchor: start; fill: #856404;">
      • ArgoCD Sync: ~1-2 minutes
    </text>
    <text x="930" y="945" style="font-size: 10px; text-anchor: start; fill: #856404;">
      • Total: ~5 minutes from push
    </text>
    <text x="930" y="957" style="font-size: 10px; text-anchor: start; fill: #856404;">
      to production 🚀
    </text>
  </g>

  <!-- Footer -->
  <text x="700" y="990" style="font-size: 11px; text-anchor: middle; fill: #999;">
    Created for KBot CI/CD Pipeline | Platform: Linux amd64 | Registry: ghcr.io
  </text>
</svg>