name: Release

on:
  push:
    branches:
      - main
      - develop

env:
  TARGETARCH: amd64
  TARGETOS: linux
  CGO_ENABLED: 0
  VALUES_FILEPATH: helm/values.yaml
  REGISTRY: ghcr.io/kseniiaevans


jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set VERSION
        run: echo "VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Run tests
        run: make test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          make image push \
            TARGETARCH=${{ env.TARGETARCH }} \
            TARGETOS=${{ env.TARGETOS }} \
            VERSION=${{ env.VERSION }} \
            REGISTRY=${{ env.REGISTRY }}


  cd:
    name: CD
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set VERSION
        run: echo "VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set version in Helm chart
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.image.tag = strenv(VERSION)' ${{ env.VALUES_FILEPATH }}

      - name: Commit Helm chart changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ${{ env.VALUES_FILEPATH }}
          git commit -m "update version to $VERSION"
          git push

      - name: Cleanup
        run: |
          make clean \
            TARGETARCH=${{ env.TARGETARCH }} \
            TARGETOS=${{ env.TARGETOS }} \
            VERSION=${{ env.VERSION }} \
            REGISTRY=${{ env.REGISTRY }}