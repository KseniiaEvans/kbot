name: Release

on:
  push:
    branches:
      - main
      - develop

env:
  TARGETARCH: amd64
  TARGETOS: linux
  CGO_ENABLED: 0


jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set VERSION
        run: echo "VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Run tests
        run: make test

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          make image push \
          TARGETARCH=${{ env.TARGETARCH }} \
          TARGETOS=${{ env.TARGETOS }} \
          VERSION=${{ env.VERSION }} \
          REGISTRY=${{ secrets.DOCKER_HUB_USERNAME }}


  cd:
    name: CD
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0


      - name: Deploy to Production
        run: echo "VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set version in Helm chart
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.image.tag = strenv(VERSION)' helm/value.yaml

      - name: Commit Helm chart changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add helm/values.yaml
          git commit -m "update version to $VERSION"
          git push

      - name: Cleanup
        run: make clean TARGETOS=${{ env.TARGETOS }} TARGETARCH=${{ env.TARGETARCH }}